name: pr-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CONTROLLER_URL: http://127.0.0.1:8088
  APP_PORT: "5000" # Use 5000 (or 3000 if your Node app uses 3000)

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Create or update preview
        id: preview
        env:
          TOKEN: ${{ secrets.PREVIEW_CONTROLLER_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        shell: "C:/Program Files/Git/bin/bash.exe {0}"
        run: |
          body="$(jq -n \
            --arg repo "$REPO_NAME" --argjson pr "$PR" \
            --arg src "$GITHUB_WORKSPACE" --argjson port "$APP_PORT" \
            '{repo: $repo, pr: $pr, source_path: $src, port: $port}')"

          response="$(curl -sS --fail-with-body --max-time 900 \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body" "${CONTROLLER_URL}/previews")"

          echo "url=$(jq -r .url <<<"$response")" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        shell: "C:/Program Files/Git/bin/bash.exe {0}"
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --edit-last --create-if-none \
            --body "Preview for \`${SHA::7}\`: ${URL}

          _Removed automatically when this PR is closed._"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: self-hosted
    steps:
      - name: Delete preview
        env:
          TOKEN: ${{ secrets.PREVIEW_CONTROLLER_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        shell: "C:/Program Files/Git/bin/bash.exe {0}"
        run: |
          curl -sS -o /dev/null -X DELETE \
            -H "Authorization: Bearer ${TOKEN}" \
            "${CONTROLLER_URL}/previews/${REPO_NAME}/${PR}"