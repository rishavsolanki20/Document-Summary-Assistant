name: pr-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CONTROLLER_URL: http://127.0.0.1:8088
  APP_PORT: "5000"

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Create or update preview
        id: preview
        env:
          TOKEN: ${{ secrets.PREVIEW_CONTROLLER_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        shell: powershell
        run: |
          $bodyData = @{
              repo = $env:REPO_NAME
              pr = [int]$env:PR
              source_path = "${{ github.workspace }}"
              port = [int]$env:APP_PORT
          } | ConvertTo-Json

          $response = curl.exe -sS --fail-with-body --max-time 900 `
              -H "Authorization: Bearer $env:TOKEN" `
              -H "Content-Type: application/json" `
              -d $bodyData "$env:CONTROLLER_URL/previews"

          $url = ($response | ConvertFrom-Json).url
          echo "url=$url" >> $env:GITHUB_OUTPUT

      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        shell: powershell
        run: |
          $shortSha = $env:SHA.Substring(0, 7)
          $body = "Preview for ``$shortSha``: $env:URL`n`n_Removed automatically when this PR is closed._"
          
          gh pr comment "${{ github.event.pull_request.number }}" `
            --repo "${{ github.repository }}" `
            --edit-last --create-if-none `
            --body $body

  cleanup:
    if: github.event.action == 'closed'
    runs-on: self-hosted
    steps:
      - name: Delete preview
        env:
          TOKEN: ${{ secrets.PREVIEW_CONTROLLER_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        shell: powershell
        run: |
          curl.exe -sS -o NUL -X DELETE `
            -H "Authorization: Bearer $env:TOKEN" `
            "$env:CONTROLLER_URL/previews/$env:REPO_NAME/$env:PR"