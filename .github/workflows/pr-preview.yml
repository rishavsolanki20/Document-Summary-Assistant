name: pr-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CONTROLLER_URL: http://127.0.0.1:8088
  APP_PORT: 5000

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Create or update preview
        id: preview
        shell: powershell
        run: |
          # Convert Windows backslashes to forward slashes for valid JSON
          $cleanWorkspace = $env:GITHUB_WORKSPACE.Replace('\', '/')

          $headers = @{
            "Authorization" = "Bearer ${{ secrets.PREVIEW_CONTROLLER_TOKEN }}"
            "Content-Type"  = "application/json"
          }

          $body = @{
            repo        = "${{ github.event.repository.name }}"
            pr          = [int]${{ github.event.pull_request.number }}
            source_path = $cleanWorkspace
            port        = [int]${{ env.APP_PORT }}
          } | ConvertTo-Json -Compress

          try {
            $response = Invoke-RestMethod -Uri "${{ env.CONTROLLER_URL }}/previews" -Method Post -Headers $headers -Body $body
            Write-Host "Preview created successfully: $($response.url)"
            echo "url=$($response.url)" >> $env:GITHUB_OUTPUT
          } catch {
            if ($_.Exception.Response) {
              $stream = $_.Exception.Response.GetResponseStream()
              $reader = New-Object System.IO.StreamReader($stream)
              Write-Host "Controller error: $($reader.ReadToEnd())"
            } else {
              Write-Host "Error: $($_.Exception.Message)"
            }
            exit 1
          }

      - name: Comment preview URL on the PR
        shell: powershell
        run: |
          $prNumber = "${{ github.event.pull_request.number }}"
          $repo = "${{ github.repository }}"
          $sha = "${{ github.event.pull_request.head.sha }}".Substring(0, 7)
          $previewUrl = "${{ steps.preview.outputs.url }}"

          $commentHeaders = @{
            "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
            "Accept"        = "application/vnd.github+json"
            "User-Agent"    = "GitHubActions"
          }
          $commentBody = @{
            body = "Preview for `$sha`: $previewUrl`n`n_Removed automatically when this PR is closed._"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$prNumber/comments" -Method Post -Headers $commentHeaders -Body $commentBody

  cleanup:
    if: github.event.action == 'closed'
    runs-on: self-hosted
    steps:
      - name: Delete preview
        shell: powershell
        run: |
          $headers = @{
            "Authorization" = "Bearer ${{ secrets.PREVIEW_CONTROLLER_TOKEN }}"
          }
          $repo = "${{ github.event.repository.name }}"
          $pr = "${{ github.event.pull_request.number }}"
          try {
            Invoke-RestMethod -Uri "${{ env.CONTROLLER_URL }}/previews/$repo/$pr" -Method Delete -Headers $headers
          } catch {
            # 404 is fine if preview wasn't created
          }